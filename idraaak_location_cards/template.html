<!doctype html>
<html lang="$language" dir="$direction">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>$title</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#17283e;font:16px/1.7 system-ui,Arial,sans-serif}
.page{max-width:1080px;margin:auto;padding:36px 24px}header{border-bottom:2px solid #cbd5e1;margin-bottom:24px;padding-bottom:24px}
.brand{font-size:13px;font-weight:700;letter-spacing:.06em;color:#23695a}h1{font-size:30px;line-height:1.45;margin:8px 0}
.subtitle{color:#52647c;margin:6px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card{position:relative;background:white;border:1px solid #cbd5e1;border-radius:14px;padding:26px;break-inside:avoid}
.number{font-weight:700;color:#55776e;font-size:14px}h2{font-size:21px;line-height:1.5;overflow-wrap:anywhere;margin:8px 0 20px}
.label{font-size:13px;color:#52647c;margin:0}.coordinates{text-align:start;font:17px/1.8 ui-monospace,monospace;margin:3px 0 18px}
.map-link{display:inline-block;border:1px solid #24765f;border-radius:8px;padding:8px 14px;color:#155a46;text-decoration:none;font-weight:600}
.url{font:11px/1.6 ui-monospace,monospace;overflow-wrap:anywhere;color:#64748b;margin:16px 0 0}
footer{font-size:13px;color:#52647c;border-top:1px solid #cbd5e1;margin-top:28px;padding-top:18px}footer a{color:#155a46}
button{font:inherit;color:white;background:#185f4c;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;margin-top:10px}
@media screen and (max-width:650px){.page{padding:22px 16px}.grid{grid-template-columns:1fr}.card{grid-row:auto!important;grid-column:auto!important}h1{font-size:25px}}
@page{size:A4;margin:12mm}@media print{body{background:white;font-size:11pt}.page{padding:0;max-width:none}header{margin-bottom:14px;padding-bottom:12px}h1{font-size:22pt}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:16px;border-radius:8px}h2{font-size:15pt}button{display:none}.coordinates{font-size:12pt}.url{font-size:8pt}footer{font-size:9pt}}
</style>
</head>
<body><main class="page">
<header><div class="brand" dir="ltr">IDRAAAK · LOCATION CARDS</div>
<h1 dir="auto">$title</h1>
<p class="subtitle">$count · $fixed</p>
<button type="button" onclick="window.print()">$print_label</button></header>
<section class="grid">$cards</section>
<footer><p>$privacy</p>
<a href="$article_url">$help</a></footer>
</main></body></html>
